[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soundbench"
version = "0.1.0"
description = "Playable physical instruments and tools for measuring and fitting sound"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cail Daley" }]
dependencies = [
  "mido>=1.3,<2", "numpy>=2", "numba>=0.61", "scipy>=1.14", "soundfile>=0.13",
  "matplotlib>=3.9", "cmudict>=1.0", "tomli-w>=1", "pyloudnorm", "librosa",
]

[project.optional-dependencies]
fit = ["jax==0.11.2", "optax>=0.2,<0.3"]
analysis = ["mir_eval", "mosqito", "praat-parselmouth>=0.4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
soundbench = "soundbench.cli:main"

[tool.setuptools.packages.find]
include = ["soundbench*"]

[tool.setuptools.package-data]
soundbench = ["instruments/models/*.toml", "instruments/models/*.json", "instruments/models/*.md", "instruments/rooms/*.json", "instruments/rooms/*.md", "scripts/models/banjo_fit/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
