# The score side of singing: singer ranges, characters and phrase timing,
# shared by every singer that reads a [singing] block (scripts/singing.py).

seed = 1892
legato_gap_s = 0.12            # a longer silence between syllables ends a phrase

# MIDI ranges a singer is gated to; a part may set its own range on purpose.
[singers.bass]
range = [40, 64]

[singers.baritone]
range = [45, 67]

[singers.tenor]
range = [48, 72]

[singers.alto]
range = [53, 74]

[singers.soprano]
range = [60, 74]

# Characters are independent of tract size and singer identity.
# Vibrato extents are half-extents in cents; attack and tail are milliseconds.
[characters.plain]
effort_center = 0.5
effort_span = 1.0
vibrato_rate = 6.8
vibrato_extent = 27.0
vibrato_delay = 0.2
vibrato = "natural"
onset = "soft"
attack_ms = 70.0
release = "held"
breath_tail_ms = 100.0
breath_gain = 1.0
roughness = 0.0
sag_cents = 0.0
vowel_opening_hz = 0.0

