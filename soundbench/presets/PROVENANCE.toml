[[sets]]
name = "Banjo"
files = [
    "banjo/default.toml",
    "banjo/membrane.toml",
    "banjo/steel.toml",
]
basis = "Hand-set membrane design (membrane) and series-body fits to Philharmonia isolated notes (default, steel)"
limits = "Source recordings do not establish resonator construction, string material or physical string assignments. Gut/steel are timbre targets."

