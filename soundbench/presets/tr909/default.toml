# TR-909 model: analog bass drum, snare and toms; cymbals and hats as frozen 6-bit "virtual ROMs".
machine = "tr909"

[engine]
sample_rate = 48000
seed = 909
unit = "studio-a"
output_gain = 0.5
tail_seconds = 3.0
velocity = "continuous"
accent = 0.6             # TOTAL ACCENT
accent_coupling = 0.15
accent_sag = 0.04
choke_ms = 2.5
rom_rate = 32000         # verify against the service notes
rom_bits = 6
rom_mu_law = false
rom_rc_hz = 12000.0
rom_flatten = true

