# Church pipe organ: per-pipe additive spectra by family, speech chiff, wind, tuning scatter.
# Levels are dB relative to a unit-RMS pipe; footage 8 sounds at written pitch (MIDI note = pitch),
# 16 an octave below, 4 an octave above. Harmonic h of a pipe at f0 has amplitude
#   h^-power / sqrt(1+(h f0/cutoff_hz)^4) * (even if h is even)
# before a seeded per-pipe voicing ripple of +-ripple_db.

[engine]
sample_rate = 48000
output_gain = 0.055
tail_seconds = 3.0
seed = 1729
registration = "principal"
a4_hz = 440.0
tuning_scatter_cents = 2.5

[wind]
level_db = -58.0
lowpass_hz = 2500.0

[swell]
# CC11 = 127 open; at 0 the box is shut: gain falls by closed_db and the top end by brightness_floor.
closed_db = -26.0
brightness_floor = 0.08
lowpass_hz = 1100.0
smooth_s = 0.03

[family.principal]
power = 1.05
cutoff_hz = 3000.0
even = 0.9
ripple_db = 1.5
attack_s = 0.026
release_s = 0.06
chiff_harmonic = 2.5
chiff_db = -36.0
chiff_ms = 30.0

[family.gedackt]
power = 1.15
cutoff_hz = 2200.0
even = 0.05
ripple_db = 1.0
attack_s = 0.040
release_s = 0.05
chiff_harmonic = 3.0
chiff_db = -27.0
chiff_ms = 45.0

[family.flute]
power = 2.0
cutoff_hz = 2400.0
even = 1.0
ripple_db = 1.2
attack_s = 0.034
release_s = 0.05
chiff_harmonic = 2.0
chiff_db = -26.0
chiff_ms = 50.0

[family.subbass]
power = 0.7
cutoff_hz = 600.0
even = 0.03
ripple_db = 0.8
attack_s = 0.075
release_s = 0.10
chiff_harmonic = 3.0
chiff_db = -34.0
chiff_ms = 60.0

[family.mixture]
power = 0.9
cutoff_hz = 4200.0
even = 0.8
ripple_db = 2.0
attack_s = 0.020
release_s = 0.05
chiff_harmonic = 2.0
chiff_db = -38.0
chiff_ms = 25.0
break_hz = 2600.0

[registration.flutes]
# Accompaniment under voices: stopped, soft, round.
range = [36, 96]
[[registration.flutes.stop]]
family = "gedackt"
footage = 8
db = 0.0
[[registration.flutes.stop]]
family = "flute"
footage = 4
db = -6.0

[registration.principal]
# The open diapason chorus of a church: Principal 8' and Octave 4'.
range = [36, 96]
[[registration.principal.stop]]
family = "principal"
footage = 8
db = 0.0
[[registration.principal.stop]]
family = "principal"
footage = 4
db = -5.0

[registration.plenum]
# Full chorus: 8' 4' 2' and a three-rank Mixture (1 1/3', 1', 2/3'), dark-voiced.
range = [36, 96]
[[registration.plenum.stop]]
family = "principal"
footage = 8
db = 0.0
[[registration.plenum.stop]]
family = "principal"
footage = 4
db = -4.0
[[registration.plenum.stop]]
family = "principal"
footage = 2
db = -5.5
[[registration.plenum.stop]]
family = "mixture"
footage = [1.3333333333, 1.0, 0.6666666667]
db = -6.0

[registration.pedal]
# Subbass 16' and Octave 8'; pedalboard C2-G4 (MIDI 36-67).
range = [36, 67]
[[registration.pedal.stop]]
family = "subbass"
footage = 16
db = 0.0
[[registration.pedal.stop]]
family = "principal"
footage = 8
db = -7.0
