# TR-808 circuit model. Knobs are the panel's 0..10 divided by 10; the rest are circuit values.
machine = "tr808"

[engine]
sample_rate = 48000
seed = 808
unit = "studio-a"        # seeds this box's component tolerances
output_gain = 0.5
tail_seconds = 3.0
velocity = "continuous"  # "continuous": velocity is trigger voltage; "accent": two levels, split at 100
accent = 0.6             # the global ACCENT knob
accent_coupling = 0.15   # hits on one step pull toward the step's strongest trigger
accent_sag = 0.04        # each extra accented voice on a step loads the accent bus
toms = "toms"            # or "congas": the panel switch for keys 41/43/45
choke_ms = 2.5           # a closed hat discharges a ringing open hat's VCA

[unit]                   # tolerance spreads, one standard deviation; draws clip at two
freq = 0.01
decay = 0.025
squares = 0.0025
level_db = 0.5

[metal]                  # six free-running Schmitt oscillators
hz = [205.3, 304.4, 369.6, 522.7, 540.0, 800.0]
duty = 0.5

[voices.bd]
level = 0.8
pan = 0.0
gain = 0.45
tune = 0.5               # internal trim between hz_lo and hz_hi
hz_lo = 44.0
hz_hi = 56.0
decay = 0.6
t60_lo = 0.15
t60_hi = 1.6
decay_s = 0.0            # >0 overrides the decay knob with a T60 in seconds
long_t60 = 2.2           # key 35: the long, note-off-gated boom
sweep_semitones = 6.7  # the pulse-loading blip at normal trigger level
sweep_ms = 74.0  # ~3 time constants of the blip
blip_accent = 1.2        # blip grows with trigger level
drive = 0.8
asymmetry = 0.25
click = 0.6
tone = 1.0  # click low-pass, 200 Hz .. 5 kHz
pulse_ms = 1.0
snap_semitones = 24.0
snap_ms = 3.0

[voices.bass]
level = 0.8
pan = 0.0
gain = 2.0
decay_s = 1.4
sweep_semitones = 6.7
