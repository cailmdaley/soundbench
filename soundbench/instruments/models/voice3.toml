[articulation]
velar_range_cm = [4.6, 6.2]    # velar place before the frontest and the backest vowel
# Tongue-body loci of velars (Sussman et al. 1991: F2 onsets about 1.6 kHz before /a/,
# 2.1 kHz before /i/, 1 kHz before /u/): fronted, or backed next to a rounded vowel.
velar_locus = ["ih", 0.5]
velar_locus_round = ["uh", 0.3]
rounded = ["uw", "ow", "uh", "ao", "w"]
# ARPAbet vowels to tract shapes; diphthongs glide from the first to the second.
vowels = { AA = ["aa"], AE = ["ae"], AH = ["ah"], AO = ["ao"], EH = ["eh"], ER = ["er"], IH = ["ih"], IY = ["iy"], UH = ["uh"], UW = ["uw"], EY = ["eh", "ih"], OW = ["ow", "uh"], AY = ["aa", "ih"], AW = ["aa", "uh"], OY = ["ao", "ih"] }
schwa = "ax"                   # unstressed AH (AH0)
open_vowel = "aa"              # the jaw opens towards this shape to tune F1 to a high note
# How front each shape is (0 back .. 1 front): places the velars.
frontness = { iy = 1.0, ih = 0.9, ey = 0.9, eh = 0.8, ae = 0.7, ax = 0.5, er = 0.5, ah = 0.45, aa = 0.2, ao = 0.1, ow = 0.1, uh = 0.2, uw = 0.1, y = 1.0, w = 0.1 }

# Singers. length_cm sets the tract (one-sample sections, 0.73 cm steps at
# 48 kHz); female tracts shorten the pharynx more than the mouth (Fant 1966).
# range: comfortable MIDI pitches, inside the harshness gate: above D5 a held note's
# fundamental carries most of its power and whistles, as v2's high holler did. The source and habits follow
# references/voice-3/real-singing; characters choose their performance intent.
# rd: Fant's soft/loud Rd anchors for the top-register source cap and the
# singer's offset from the shared low-register effort curve.
# drift_cents: a note's starting offset and
# its slow wander (SD). word_scoop_cents: the rise into a word after a consonant.
# closure: glottal closure sharpening at soft and loud singing (brightness above 1 kHz).
# aperiodicity: noise between the high partials at the top of the range (see
# [aero] aperiodic_*; voice3.upper_register).
# rd, closure and aperiodicity are fitted to the harshness gate
# (references/voice-3/harshness, scripts/voice3_lab.py harsh) with the words still
# intelligible; the gate covers notes inside each singer's range.
