# The machine: the tenor's tract sung the way Kelly and Lochbaum's 1961 IBM
# 7094 sang Daisy Bell, every note dead on pitch and level, no vibrato, no
# scoops, no wander. On its own it is the plain tract; with a part's
# `machine` colour (render_voice3.py) it is the vocoder or the talkbox.
aperiodicity = 0.15
f1_tuning = 0.0
[singers.machine]
length_cm = 17.5
pharynx_scale = 1.0
range = [45, 72]
nasal_scale = 1.0
rd = [1.0, 0.95]
breathiness = 0.4
jitter = 0.0005
shimmer = 0.004
flutter_cents = 0.0
