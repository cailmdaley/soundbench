# Voice 3: a singer of words (scripts/models/voice3.py).
# The tract, walls, nasal branch and Story (2008) vowel shapes are voice.toml's;
# this file adds the consonants, the singer's timing, the source and the singers.
# Lengths in cm, areas in cm^2, places measured from the lip opening of the
# 17.5 cm reference tract (a singer's tract scales them by its own length).
# Every value is a modelling choice unless a comment cites a source.

[engine]
seed = 1892
lead_seconds = 0.5        # pre-roll: onset consonants and the first breath sit before the first beat
tail_seconds = 1.2
output_gain = 0.08

[timing]
# Singer timing: the vowel lands on the beat, consonants are sung before it.
vowel_lead_s = 0.010           # the vowel starts this much before the written onset (its perceptual centre is later)
min_vowel_fraction = 0.45      # a syllable's vowel keeps at least this share of its note's time
consonant_floor = 0.5          # consonants compress to no less than this share of their nominal length
legato_gap_s = 0.12            # a longer silence between syllables ends a phrase
rest_gap_s = 0.4               # a syllable-less note after a longer gap is not a melisma (a written rest)
breath_gap_s = 0.4             # a phrase gap at least this long carries an audible inhalation
final_coda_overlap = 0.35      # share of a phrase-final coda sung before the note's end
diphthong_glide_s = 0.10       # an offglide takes the last part of the vowel, as singers hold the first element
diphthong_share = 0.3          # but never more than this share of it
second_vowel_share = 0.4       # in a merged nucleus (flow'r on one note), the later vowel's share
vowel_in_s = 0.035             # formant transition into a vowel after its onset consonant
vowel_out_s = 0.02             # and out of it before a coda
nasal_anticipation_s = 0.07    # the velum opens this long before a nasal (coda nasals colour the vowel)
nasal_carryover_s = 0.03
glide_hold = 0.35              # w, y, r hold their shape for this share of their length
release_s = 0.18               # phonation fades over this at a phrase end
final_taper = 0.35             # a held phrase-final vowel tapers over this share of its length
final_taper_max_s = 1.2        # (at least release_s, at most this), half of it inside the note,
final_taper_db = 36.0          # falling this many dB evenly before it closes

[aero]
# Two orifices in series (glottis, narrowest oral constriction) with the
# velum as a parallel outlet; oral pressure relaxes towards their steady state.
glottal_area_cm2 = 0.08        # mean area of the vibrating glottis
abduction_cm2 = 0.3            # added area at full abduction (voiceless consonants, h)
pressure_tau_ms = 4.0
voiced_tau_ms = 20.0           # in a voiced closure the walls and a lowered larynx expand the cavity
voicing_pressure_loss = 0.8    # phonation fades as oral pressure approaches subglottal
voicing_abduction = 0.55       # vocal folds stop vibrating at this abduction
turbulence_max_area_cm2 = 0.5  # wider constrictions make no turbulence
frication_gain = 0.15          # turbulence at a constriction: gain * obstacle * sqrt(A) * P^1.5
aspiration_gain = 0.015        # glottal turbulence: gain * abduction * (Ps - Po)^1.5
burst_gain = 0.35              # the release transient: gain * oral pressure at release
burst_ms = 1.0                 # its decay time (a stop's own burst_ms overrides)
aspiration_hold = 0.6          # share of a voiceless stop's VOT the folds stay fully apart
sibilant_hz = 1800.0           # sibilant source: a jet striking the teeth, a broad hump between
sibilant_lowpass_hz = 9500.0   # these two corners
flat_hz = 400.0                # non-sibilant and burst source: broadband above this
aspiration_hz = 500.0          # glottal turbulence, band-limited
aspiration_lowpass_hz = 4500.0
radiated_gain = 2.0            # turbulence at the lips radiates directly (f, v, p's burst)
radiated_lowpass_hz = 2000.0   # with a falling spectrum above this
inhale_gain = 0.004
source_corner_hz = 4000.0      # the voiced source falls a further 6 dB/oct above this (return phase)
aperiodic_hz = 3000.0          # band aperiodicity: glottal turbulence pulsed by the flow, between these (above F3: lower, it masks the words)
aperiodic_lowpass_hz = 4000.0  # corners (falling above like the source itself)
aperiodic_gain = 1.0           # times a singer's aperiodicity, against the glottal flow

# Consonants. kind: stop, fricative, affricate, nasal, lateral, glide, aspirate.
# place/width/area: the constriction ([place_cm, width_cm, area_cm2]).
# onset_ms / coda_ms: nominal sung length (closure for stops), compressed when notes are short.
# vot_ms: voice onset time after a stop's release in an onset (aspiration for p t k).
# release: area growth after release (cm^2/s): fast tongue tip, slower lips, slowest tongue body.
# source_cm: where turbulence is injected (sibilants: the teeth; 0 radiates at the lips;
# negative: just downstream of the constriction); obstacle: its strength.
# lips_cm2: lip rounding during the consonant. shape: a whole tract shape (glides).
# locus: [shape, weight] the tongue body moves towards (coda_locus after a vowel).
# burst: the release transient's strength (weak at the lips, strong behind a front cavity).
# burst_ms: its decay time (Stevens 1998: a few ms at the lips and the tongue tip, longest for velars).
# abduction: glottal opening during a voiced fricative (0..1 of a voiceless one's).
