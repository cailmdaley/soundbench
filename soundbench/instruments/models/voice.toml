# Kelly-Lochbaum singing voice (scripts/models/voice.py).
# Lengths in cm, areas in cm^2, places measured from the lip opening.

[engine]
sample_rate = 48000
seed = 1961
control_ms = 1.0
oversample = 4            # glottal pulses are generated at 4x and decimated
tail_seconds = 1.0
lead_seconds = 0.3        # pre-roll so consonants before the first beat have room
output_gain = 0.25
output_lowpass_hz = 10000.0   # removes the waveguide's mirror image above 12 kHz

[tract]
# 17.5 cm, as for an adult male; 24 one-sample sections at 48 kHz.
# Shortening the tract is the formant shift: formants scale by 17.5/length.
length_cm = 17.5
speed_of_sound_cm_s = 35000.0
air_density_g_cm3 = 0.00114
# Yielding walls: mass and resistance per unit wall area (cgs). The mass sets
# the closed-tract wall resonance that raises a low F1 (/i/, /u/).
wall_mass_g_cm2 = 1.9
wall_resistance_cgs = 1000.0
glottal_reflection = 0.75
lip_reflection = 0.9
lip_radiation_hz = 5000.0
wall_loss = 0.999
min_area_cm2 = 0.0005
wall_radiation = 0.5
wall_radiation_hz = 300.0

[nasal]
# A smooth nasal-passage profile from the velum to the nostrils. It is an
# approximation chosen for this model, not measured data. The first value is
# replaced at run time by the velum opening.
length_cm = 11.0
velum_from_glottis_cm = 9.5
areas_cm2 = [0.5, 1.2, 2.0, 2.8, 3.2, 3.2, 3.0, 2.6, 2.0, 1.4, 1.0, 0.8]
loss = 0.995
nostril_reflection = 0.9
nostril_radiation_hz = 3000.0
coupling_cm2 = 0.5        # velum opening for m and n
open_ms = 50.0            # the velum opens this early (vowel nasalization before a nasal)
close_ms = 30.0

[source]
# LF timing [tp, te, ta] as fractions of the period, at effort 0 and 1.
soft_lf = [0.50, 0.72, 0.05]
loud_lf = [0.40, 0.55, 0.015]
effort_velocity = [40, 115]
velocity_db = 24.0        # velocity 127 is 0 dB; velocity 0 is -24 dB
jitter = 0.004            # per-period relative standard deviation
shimmer = 0.03
breathiness = 0.03
aspiration_hz = 800.0

[expression]
vibrato_hz = 5.5
vibrato_cents = 40.0
vibrato_delay_s = 0.25
vibrato_rise_s = 0.35
vibrato_wander = 0.03     # relative rate wander
vibrato_amplitude = 0.04
portamento_s = 0.09
legato_gap_s = 0.08
scoop_cents = 25.0
scoop_s = 0.09
attack_s = 0.06
release_s = 0.2
release_droop_cents = 30.0
note_arc_db = 1.5
onset_after_beat = 0.3    # fraction of an onset consonant cluster sung after the beat
min_vowel_fraction = 0.45

[aero]
subglottal_pressure = 1.0
glottal_area_cm2 = 0.08
abduction_cm2 = 0.25
pressure_tau_ms = 8.0
noise_gain = 0.15         # turbulence at a constriction
aspiration_gain = 0.05    # breath noise at an abducted glottis
turbulence_max_area_cm2 = 0.6
voicing_pressure_loss = 0.85
breath_lead_s = 0.03

# Shapes that are not in Story (2008): built from a base vowel by
# [place_cm, width_cm, area_cm2] constrictions. Not measured data.
# The r-coloured schwa is a bunched r (lips, palate, pharynx) fitted so the
# transmission-line formants (walls and lip load included) of the 17.5 cm shape equal Peterson & Barney's
# (1952) adult-male average for the vowel in "her": 490, 1350, 1690 Hz.
[constructed.er]
base = "ax"
constrictions = [[0.4, 0.8, 1.51], [6.18, 2.3, 0.16], [13.44, 3.0, 0.51]]
duration_ms = 0.0

[constructed.y]
base = "iy"
constrictions = [[3.0, 1.5, 0.15]]
duration_ms = 70.0

[constructed.w]
base = "uw"
constrictions = [[0.4, 0.8, 0.08]]
duration_ms = 70.0

[consonants.d]
noise_gain = 2.0
place_cm = 2.0
width_cm = 0.8
area_cm2 = 0.0
duration_ms = 55.0
in_ms = 12.0
out_ms = 6.0
voiced = true
noise_hz = 3500.0
noise_q = 0.7

[consonants.g]
noise_gain = 2.0
place_cm = 6.5
width_cm = 1.5
area_cm2 = 0.0
duration_ms = 65.0
in_ms = 12.0
out_ms = 8.0
voiced = true
noise_hz = 2000.0
noise_q = 1.2

[consonants.z]
